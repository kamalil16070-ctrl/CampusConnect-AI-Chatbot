    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<style>
    :root {
    --primary-blue: #0057B8;
    --secondary-blue: #003D82;
    --light-blue: #E6F0FF;
    --white: #FFFFFF;
    --light-gray: #F8F9FA;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--light-gray);
    color: #333;
    line-height: 1.6;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.construction-container {
    text-align: center;
    max-width: 600px;
    padding: 2rem;
    background-color: var(--white);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 87, 184, 0.1);
}

.construction-icon {
    font-size: 4rem;
    color: var(--primary-blue);
    margin-bottom: 1.5rem;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

h1 {
    color: var(--primary-blue);
    margin-bottom: 1rem;
    font-weight: 600;
}

p {
    color: #555;
    margin-bottom: 2rem;
    font-size: 1.1rem;
}

.construction-checklist {
    list-style: none;
    text-align: left;
    margin: 2rem 0;
    padding: 0 1rem;
}

.construction-checklist li {
    padding: 0.8rem 0;
    font-size: 1.1rem;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
}

.construction-checklist li:last-child {
    border-bottom: none;
}

.construction-checklist i {
    margin-right: 1rem;
    width: 20px;
    text-align: center;
}

.unchecked i {
    color: #aaa;
}

.checked i {
    color: var(--primary-blue);
}

.checked a {
    color: var(--primary-blue);
    text-decoration: none;
    transition: all 0.3s;
}

.checked a:hover {
    color: var(--secondary-blue);
    text-decoration: underline;
}

.progress-container {
    background-color: #eee;
    border-radius: 20px;
    height: 30px;
    margin: 2rem 0;
    position: relative;
    overflow: hidden;
}

.progress-bar {
    background-color: var(--primary-blue);
    height: 100%;
    border-radius: 20px;
    transition: width 1s ease-in-out;
}

.progress-container span {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--white);
    font-weight: 600;
    font-size: 0.9rem;
}

/* Responsive Design */
@media (max-width: 600px) {
    .construction-container {
        margin: 1rem;
        padding: 1.5rem;
    }
    
    h1 {
        font-size: 1.8rem;
    }
    
    p {
        font-size: 1rem;
    }
    
    .construction-checklist li {
        font-size: 1rem;
    }
}
</style>
